function maxPain(inp){return Math.max(Number(inp.lowerPain||0),Number(inp.backPain||0),Number(inp.upperPain||0))}
function currentInput(){const d=state.daily[todayISO()]||{};return {date:todayISO(),sleep:d.sleep||state.recovery.sleepHours,readiness:d.readiness||3,lowerPain:d.lowerPain??2,backPain:d.backPain??0,upperPain:d.upperPain??2,basketballLoad:d.basketballLoad||'None',time:d.time||45,gameSoon:!!d.gameSoon,newInjury:!!d.newInjury,changedMovement:!!d.changedMovement,notes:d.notes||''}}
function stateDecision(inp){if(inp.newInjury||inp.changedMovement)return 'RED';if(Number(inp.backPain)>=7||Number(inp.lowerPain)>=8)return 'RED';if(Number(inp.readiness)<=2||Number(inp.lowerPain)>=4||Number(inp.backPain)>=4||Number(inp.upperPain)>=5||['Hard','Game'].includes(inp.basketballLoad))return 'YELLOW';return 'GREEN'}
function recommend(inp){const st=stateDecision(inp),mins=Number(inp.time||45),lb=Number(inp.lowerPain||0),recentHigh=['Hard','Game'].includes(inp.basketballLoad), next=state.settings.nextAnchor||'A';
 if(st==='RED') return {state:st,title:'Recovery / assessment mode',desc:'Do not add progressive loading to the affected area. Use only symptom-free gentle movement if appropriate and seek in-person assessment for persistent/worsening symptoms or neurological/red-flag symptoms.',modules:['Recovery / mobility'],anchor:null};
 if(st==='YELLOW' && (recentHigh||lb>=4)) return {state:st,title:'Upper + durability microdose',desc:'Lower-body stress is already high or symptoms are elevated. Keep the useful work without stacking another large lower-body dose.',modules:['Upper strength','Durability','Optional mobility'],anchor:null};
 if(st==='YELLOW') return {state:st,title:next==='A'?'Reduced Anchor A':'Reduced Anchor B',desc:'Keep the main movement patterns but reduce sets and omit optional power/physique volume.',modules:[next==='A'?'Reduced Anchor A':'Reduced Anchor B'],anchor:next};
 if(mins>=50) return {state:st,title:`Full Anchor ${next}`,desc:'Green day with enough time for the full progression anchor.',modules:[`Anchor ${next}`,'Optional physique'],anchor:next};
 if(mins>=30) return {state:st,title:`Short Anchor ${next}`,desc:'Keep the high-value blocks; remove optional accessories.',modules:[`Short Anchor ${next}`],anchor:next};
 if(mins>=15) return {state:st,title:'Minimum Effective Session',desc:'One high-priority exposure + one strength pattern + durability.',modules:['Power or upper-body','One strength pattern','Durability'],anchor:null};
 return {state:st,title:'10-minute microdose',desc:'Durability + mobility/control, with no forced volume.',modules:['Durability','Mobility'],anchor:null};
}
function saveDaily(){const f=id=>document.getElementById(id)?.value;state.daily[todayISO()]={sleep:f('d-sleep'),readiness:Number(f('d-readiness')),lowerPain:Number(f('d-lower')),backPain:Number(f('d-back')),upperPain:Number(f('d-upper')),basketballLoad:f('d-ball'),time:Number(f('d-time')),gameSoon:document.getElementById('d-game')?.checked,newInjury:document.getElementById('d-new')?.checked,changedMovement:document.getElementById('d-change')?.checked,notes:f('d-notes')||''};save();toast('Today inputs saved');renderToday()}
function plannedIds(rec){if(rec.anchor==='A')return anchorA;if(rec.anchor==='B')return anchorB;if(rec.title==='Reduced Anchor A')return anchorA.filter(x=>!['cmj'].includes(x)).slice(0,6);if(rec.title==='Reduced Anchor B')return anchorB.filter(x=>!['broad'].includes(x)).slice(0,6);if(rec.title==='Upper + durability microdose')return ['chestpress','rowchest','pullup','calf','sideplank'];if(rec.title==='Minimum Effective Session')return ['mbchest','chestpress','calf','sideplank'];if(rec.title==='10-minute microdose')return ['balance','calf','sideplank'];return []}
function exerciseRow(id,index){const e=exercise(id);return `<div class="card" style="padding:12px"><div class="row spaced"><div><strong>${esc(e.name)}</strong><div class="small muted">${esc(e.bucket)} • ${esc(e.equipment)}</div></div><span class="tag">${esc(e.type)}</span></div><div class="log-grid" style="margin-top:10px"><input id="ex-${index}-sets" type="number" min="0" placeholder="sets" value="${esc(e.sets.split('–')[0])}"><input id="ex-${index}-reps" placeholder="reps" value="${esc(e.reps)}"><input id="ex-${index}-load" placeholder="load kg / BW"/><input id="ex-${index}-rir" type="number" min="0" step="0.5" placeholder="RIR" value="${e.rir==='N/A'?'':esc(e.rir.split('–')[0])}"></div><div class="row" style="margin-top:8px"><label class="small muted"><input type="checkbox" id="ex-${index}-done"> completed</label><input id="ex-${index}-pain" class="field" style="width:120px" type="number" min="0" max="10" placeholder="pain 0–10"><input id="ex-${index}-note" class="field" style="flex:1;min-width:180px" placeholder="technique / symptom note"></div></div>`}
function beginSession(){const inp=currentInput(),rec=recommend(inp),ids=plannedIds(rec);if(rec.state==='RED'){toast('Red state: no progressive session started.');return}const session={id:uid(),date:todayISO(),title:rec.title,state:rec.state,anchor:rec.anchor,inputs:inp,exercises:ids.map((id,i)=>({id,index:i,completed:false,sets:'',reps:'',load:'',rir:'',pain:'',note:''})),duration:inp.time,sessionRpe:'',notes:''};state.logs.unshift(session);if(rec.anchor)state.settings.nextAnchor=rec.anchor==='A'?'B':'A';save();renderLog();go('log');toast('Session created — log each exercise below')}
function completeSession(id){const s=state.logs.find(x=>x.id===id);if(!s)return;const d=document.querySelector(`[data-session="${id}"]`);if(!d)return;s.exercises.forEach((x,i)=>{x.sets=d.querySelector(`#s-${id}-${i}-sets`)?.value||'';x.reps=d.querySelector(`#s-${id}-${i}-reps`)?.value||'';x.load=d.querySelector(`#s-${id}-${i}-load`)?.value||'';x.rir=d.querySelector(`#s-${id}-${i}-rir`)?.value||'';x.pain=d.querySelector(`#s-${id}-${i}-pain`)?.value||'';x.completed=!!d.querySelector(`#s-${id}-${i}-done`)?.checked;x.note=d.querySelector(`#s-${id}-${i}-note`)?.value||''});s.duration=Number(d.querySelector(`#s-${id}-duration`)?.value||s.duration||0);s.sessionRpe=Number(d.querySelector(`#s-${id}-rpe`)?.value||0);s.notes=d.querySelector(`#s-${id}-notes`)?.value||'';s.completedAt=new Date().toISOString();save();toast('Workout saved');renderLog()}
function deleteSession(id){if(!confirm('Delete this workout log?'))return;state.logs=state.logs.filter(x=>x.id!==id);save();renderLog();toast('Workout deleted')}
function addMeasurement(){const date=document.getElementById('m-date').value||todayISO();state.measurements.unshift({date,weight:val('m-weight'),cmj:val('m-cmj'),broad:val('m-broad'),pullups:val('m-pullups'),notes:val('m-notes')});save();toast('Measurement saved');renderProgress()}
function val(id){return document.getElementById(id)?.value||''}
function updateProfile(){const fields=['name','age','sex','heightCm','weightKg','positions','goalWeight'];fields.forEach(k=>{const el=document.getElementById('p-'+k);if(el)state.profile[k]=el.value});state.health.clinicalNote=document.getElementById('p-note')?.value||state.health.clinicalNote;save();toast('Profile saved');renderSettings()}
function exportJSON(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});downloadBlob(blob,'athlete-os-backup.json')}
function exportCSV(){const rows=[['date','title','state','duration_min','session_rpe','session_load','exercise','bucket','sets','reps','load','rir','pain','completed','note']];state.logs.forEach(s=>s.exercises.forEach(x=>{const e=exercise(x.id)||{};rows.push([s.date,s.title,s.state,s.duration,s.sessionRpe,s.duration*Number(s.sessionRpe||0),e.name||x.id,e.bucket||'',x.sets,x.reps,x.load,x.rir,x.pain,x.completed?'yes':'no',x.note||''])}));const csv=rows.map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\n');downloadBlob(new Blob([csv],{type:'text/csv'}),'athlete-os-workout-log.csv')}
function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importJSON(file){const reader=new FileReader();reader.onload=()=>{try{const incoming=JSON.parse(reader.result);if(!incoming.profile||!incoming.logs)throw new Error('Invalid backup');state=incoming;save();render();toast('Backup imported')}catch(e){alert('Could not import this file.')}};reader.readAsText(file)}

function saveQuickLog(){const s={id:uid(),date:val('q-date')||todayISO(),title:val('q-type'),state:'LOGGED',anchor:null,inputs:null,exercises:[],duration:Number(val('q-duration')||0),sessionRpe:Number(val('q-rpe')||0),notes:val('q-notes')||'',type:'external'};state.logs.unshift(s);save();document.getElementById('quickModal')?.remove();render();toast('Quick log saved')}
function renderToday(){const v=document.getElementById('view-today');const inp=currentInput();const rec=recommend(inp);const stateClass=rec.state.toLowerCase();const recent=state.logs.filter(x=>x.date>=new Date(Date.now()-7*864e5).toISOString().slice(0,10));const load=recent.reduce((a,x)=>a+Number(x.duration||0)*Number(x.sessionRpe||0),0);v.innerHTML=`<div class="hero"><div class="card"><div class="kicker">${fmtDate(todayISO())}</div><h2>${esc(rec.title)}</h2><p class="muted">${esc(rec.desc)}</p><div class="badge-row"><span class="pill ${stateClass==='green'?'good':stateClass==='yellow'?'warn':'danger'}">${rec.state}</span><span class="pill">Next anchor: ${esc(state.settings.nextAnchor)}</span><span class="pill">7-day logged load: ${Math.round(load)}</span></div><div class="row" style="margin-top:14px"><button class="btn primary" onclick="beginSession()">Start recommended session</button><button class="btn" onclick="go('plan')">View system</button></div></div><div class="card state ${stateClass}"><div class="circle">${rec.state}</div><div class="muted small">Adaptive readiness state</div></div></div>

function renderLog(){const v=document.getElementById('view-log');if(!state.logs.length){v.innerHTML=`<div class="empty"><h2>No workouts logged yet</h2><p>Use Today → Start recommended session, or Quick Log a basketball practice/game.</p><button class="btn primary" onclick="go('today')">Go to Today</button></div>`;return}const cards=state.logs.slice(0,20).map(s=>{if(s.type==='external')return `<div class="card"><div class="row spaced"><div><div class="kicker">${fmtDate(s.date)}</div><h3 style="margin:3px 0">${esc(s.title)}</h3><div class="muted small">${s.duration} min • RPE ${s.sessionRpe||'—'} • load ${Math.round(Number(s.duration||0)*Number(s.sessionRpe||0))}</div></div><button class="btn danger" onclick="deleteSession('${s.id}')">Delete</button></div><p class="small muted">${esc(s.notes||'')}</p></div>`;
 return `<div class="card" data-session="${s.id}"><div class="row spaced"><div><div class="kicker">${fmtDate(s.date)}</div><h3 style="margin:3px 0">${esc(s.title)}</h3><span class="pill ${s.state==='GREEN'?'good':s.state==='YELLOW'?'warn':'danger'}">${s.state}</span></div><button class="btn danger" onclick="deleteSession('${s.id}')">Delete</button></div><div style="display:grid;gap:10px;margin-top:12px">${s.exercises.map((x,i)=>{const e=exercise(x.id)||{};return `<div class="module"><div class="row spaced"><div><strong>${esc(e.name||x.id)}</strong><div class="small muted">${esc(e.bucket||'')}</div></div><label class="small"><input id="s-${s.id}-${i}-done" type="checkbox" ${x.completed?'checked':''}> done</label></div><div class="log-grid" style="margin-top:8px"><input id="s-${s.id}-${i}-sets" value="${esc(x.sets)}" placeholder="sets"><input id="s-${s.id}-${i}-reps" value="${esc(x.reps)}" placeholder="reps"><input id="s-${s.id}-${i}-load" value="${esc(x.load)}" placeholder="load kg/BW"><input id="s-${s.id}-${i}-rir" value="${esc(x.rir)}" placeholder="RIR"></div><div class="row" style="margin-top:8px"><input id="s-${s.id}-${i}-pain" style="width:120px" value="${esc(x.pain)}" placeholder="pain 0–10"><input id="s-${s.id}-${i}-note" style="flex:1;min-width:180px" value="${esc(x.note)}" placeholder="note"></div></div>`}).join('')}</div><div class="formgrid-2 formgrid" style="margin-top:12px"><div class="field"><label>Actual duration (min)</label><input id="s-${s.id}-duration" type="number" value="${esc(s.duration)}"></div><div class="field"><label>Session RPE 1–10</label><input id="s-${s.id}-rpe" type="number" min="1" max="10" value="${esc(s.sessionRpe)}"></div></div><div class="field" style="margin-top:10px"><label>Session notes</label><textarea id="s-${s.id}-notes">${esc(s.notes||'')}</textarea></div><div class="sticky-actions"><button class="btn primary" onclick="completeSession('${s.id}')">Save workout</button></div></div>`}).join('');v.innerHTML=`<div class="row spaced"><div><div class="kicker">Training history</div><h2 style="margin:3px 0">Workout Log</h2><div class="muted">Log the actual dose, not the planned dose.</div></div><div class="row"><button class="btn" onclick="exportCSV()">Export CSV</button><button class="btn" onclick="openQuickLog()">Quick Log</button></div></div><div style="display:grid;gap:12px;margin-top:14px">${cards}</div>`}
function renderPlan(){const v=document.getElementById('view-plan');const a=anchorA.map(id=>exercise(id));const b=anchorB.map(id=>exercise(id));const moduleCards=[['P','Power','High-quality explosive exposure. Basketball already provides substantial jumping/sprinting.'],['F-L','Lower force','One knee-dominant + one hip-dominant pattern.'],['F-U','Upper force','One push + one pull.'],['D','Durability','Ankle + trunk every anchor; add shoulder when useful.'],['H','Physique','Optional 1–3 accessory movements when recovery/time allow.'],['M','Mobility/body control','Short active range/control exposures; not a random stretching day.']];v.innerHTML=`<div class="card" style="margin-bottom:14px"><div class="row spaced"><div><div class="kicker">Weekly reality</div><h3 style="margin:3px 0">Basketball schedule is a moving constraint</h3><div class="muted small">${esc(state.sport.practicesPerWeek)} practices • ${esc(state.sport.gamesPerWeek)} game • ${esc(state.sport.practiceDuration)}</div></div><span class="pill info">Highly unpredictable</span></div><div class="grid grid-3" style="margin-top:10px">${Object.entries(state.sport.availability).map(([d,t])=>`<div class="module"><strong>${esc(d)}</strong><div class="small muted">${esc(t)}</div></div>`).join('')}</div></div><div class="hero"><div class="card"><div class="kicker">System architecture</div><h2>Anchor + Floating Modules + Adaptive Readiness Engine</h2><p class="muted">Two stable strength anchors build progression. Everything else moves around basketball, PE, games, readiness and symptoms.</p><div class="notice good"><strong>Weekly target:</strong> achieve the right exposures, not a fixed number of gym days.</div></div><div class="card"><div class="kicker">Current next anchor</div><div class="metric">${state.settings.nextAnchor}</div><div class="muted">The system alternates after an anchor is started.</div></div></div>

function renderExercises(){const v=document.getElementById('view-exercises');const q=window.exerciseQuery||'';const bucket=window.exerciseBucket||'All';const type=window.exerciseType||'All';const list=state.exercises.filter(e=>(!q||[e.name,e.bucket,e.notes,e.equipment,e.type].join(' ').toLowerCase().includes(q.toLowerCase()))&&(bucket==='All'||e.bucket.includes(bucket))&&(type==='All'||e.type===type));const buckets=[...new Set(state.exercises.map(e=>e.bucket.split(' • ')[0]))];v.innerHTML=`<div class="row spaced"><div><div class="kicker">Movement database</div><h2 style="margin:3px 0">Exercises & substitutions</h2><div class="muted">Select by objective, then by symptom compatibility, technique, loadability and preference.</div></div></div><div class="card" style="margin-top:14px"><div class="formgrid-2 formgrid"><div class="field"><label>Search</label><input id="ex-q" value="${esc(q)}" placeholder="exercise, bucket, equipment…" oninput="window.exerciseQuery=this.value;renderExercises()"></div><div class="field"><label>Type</label><select onchange="window.exerciseType=this.value;renderExercises()"><option>All</option><option ${type==='Power'?'selected':''}>Power</option><option ${type==='Strength'?'selected':''}>Strength</option><option ${type==='Durability'?'selected':''}>Durability</option><option ${type==='Hypertrophy'?'selected':''}>Hypertrophy</option></select></div></div></div><div class="grid grid-2" style="margin-top:14px">${list.map(e=>`<div class="exercise-card card"><div><div class="kicker">${esc(e.bucket)}</div><h3 style="margin:3px 0">${esc(e.name)}</h3><div class="badge-row"><span class="tag">${esc(e.equipment)}</span><span class="tag">${esc(e.type)}</span></div><p class="muted small">${esc(e.notes)}</p><div class="small">${esc(e.sets)} sets • ${esc(e.reps)} • RIR ${esc(e.rir)} • ${esc(e.rest)}</div></div><div><button class="btn" onclick="useExercise('${e.id}')">Use</button></div></div>`).join('')}</div>`}
function useExercise(id){const e=exercise(id);toast(`${e.name} selected — use it in the same movement bucket.`)}
function renderProgress(){const v=document.getElementById('view-progress');const ms=state.measurements.slice(0,8);const wt=ms.map(x=>Number(x.weight||0)).filter(Boolean);const cmj=ms.map(x=>Number(x.cmj||0)).filter(Boolean);const broad=ms.map(x=>Number(x.broad||0)).filter(Boolean);const pu=ms.map(x=>Number(x.pullups||0)).filter(Boolean);const avg=(arr)=>arr.length?Math.round(arr.reduce((a,b)=>a+b,0)/arr.length*10)/10:'—';const seven=state.logs.filter(x=>x.date>=new Date(Date.now()-7*864e5).toISOString().slice(0,10));const load=seven.reduce((a,x)=>a+Number(x.duration||0)*Number(x.sessionRpe||0),0);const sessions7=seven.length;const today=state.daily[todayISO()];v.innerHTML=`<div class="grid grid-4"><div class="card"><div class="kicker">7-day load</div><div class="metric">${Math.round(load)}</div><div class="muted">session-RPE units</div></div><div class="card"><div class="kicker">7-day sessions</div><div class="metric">${sessions7}</div><div class="muted">logged activities</div></div><div class="card"><div class="kicker">Avg readiness</div><div class="metric">${avg(Object.values(state.daily).slice(-7).map(x=>Number(x.readiness||0)).filter(Boolean))}</div><div class="muted">recent entries</div></div><div class="card"><div class="kicker">Latest weight</div><div class="metric">${ms[0]?.weight||state.profile.weightKg}</div><div class="muted">kg</div></div></div><div class="section-title"><div class="kicker">Performance checkpoints</div><h2 style="margin:4px 0">Measurements</h2></div><div class="card"><div class="formgrid"><div class="field"><label>Date</label><input id="m-date" type="date" value="${todayISO()}"></div><div class="field"><label>Weight kg</label><input id="m-weight" type="number" step="0.1"></div><div class="field"><label>CMJ cm</label><input id="m-cmj" type="number" step="0.5"></div><div class="field"><label>Broad jump cm</label><input id="m-broad" type="number" step="1"></div><div class="field"><label>Pull-ups</label><input id="m-pullups" type="number" step="1"></div><div class="field"><label>Notes</label><input id="m-notes"></div></div><div class="row" style="margin-top:12px"><button class="btn primary" onclick="addMeasurement()">Save measurement</button></div></div><div class="grid grid-2" style="margin-top:14px"><div class="card"><h3>Latest values</h3><div class="table-wrap"><table class="table"><thead><tr><th>Metric</th><th>Latest</th><th>Average logged</th></tr></thead><tbody><tr><td>Weight</td><td>${ms[0]?.weight||'—'} kg</td><td>${avg(wt)} kg</td></tr><tr><td>CMJ</td><td>${ms[0]?.cmj||'—'} cm</td><td>${avg(cmj)} cm</td></tr><tr><td>Broad jump</td><td>${ms[0]?.broad||'—'} cm</td><td>${avg(broad)} cm</td></tr><tr><td>Pull-ups</td><td>${ms[0]?.pullups||'—'}</td><td>${avg(pu)}</td></tr></tbody></table></div></div><div class="card"><h3>Recent checkpoints</h3>${ms.length?ms.map(m=>`<div class="module" style="margin-top:8px"><div class="row spaced"><strong>${fmtDate(m.date)}</strong><span class="tag">${m.weight||'—'} kg</span></div><div class="small muted">CMJ ${m.cmj||'—'} • broad ${m.broad||'—'} • pull-ups ${m.pullups||'—'}</div></div>`).join(''):'<div class="empty">No measurements yet.</div>'}</div></div>`}
function renderRules(){const v=document.getElementById('view-rules');const rules=[['Priority 1','Explosive basketball performance'],['Priority 2','Overall health + hybrid-athlete capability'],['Priority 3','Athletic physique / comfortable body composition'],['Rule','Basketball load counts as training; gym complements it rather than duplicating it.'],['Rule','Use weekly exposure targets, not fixed calendar sessions.'],['Rule','Power is quality-first; do not chase jump count.'],['Rule','Main compounds stay ~2–3 RIR during onboarding.'],['Rule','Progress only when technique and symptom response are stable.'],['Rule','If an exercise irritates a joint, preserve the movement objective with a compatible substitute.'],['Rule','Green = develop; Yellow = modify/maintain; Red = protect/assess.'],['Rule','Tracking stays minimal: sleep, readiness, pain, recent load, time; post-session duration + RPE.'],['Rule','Adult research is not presented as youth-specific evidence.']];v.innerHTML=`<div class="kicker">Operating rules</div><h2 style="margin:3px 0 14px">Rules & safeguards</h2><div class="rulegrid">${rules.map(r=>`<div class="rule"><strong>${esc(r[0])}</strong><span class="muted">${esc(r[1])}</span></div>`).join('')}</div><div class="section-title"><div class="kicker">Safety</div><h2 style="margin:4px 0">Know when the programme should stop being self-directed</h2></div><div class="grid grid-3"><div class="card"><h3>Red state</h3><p class="muted">New injury, pain changing movement, major symptom change, neurological symptoms, illness or other concerning features.</p></div><div class="card"><h3>Back</h3><p class="muted">Recent intermittent back pain is not automatically “posture” or “weakness.” Persistent or worsening adolescent-athlete back pain should be assessed clinically.</p></div><div class="card"><h3>Knee/ankle</h3><p class="muted">Use symptom-compatible range and progressive capacity; don't force painful depth or impact simply to meet a template.</p></div></div>`}
function renderResearch(){const v=document.getElementById('view-research');const sources=[
['Faigenbaum et al., 2009','Youth resistance training: Updated position statement paper from the National Strength and Conditioning Association','Journal of Strength and Conditioning Research 23(5 Suppl): S60–S79. Youth-specific position statement on safe, progressive resistance training.','https://pubmed.ncbi.nlm.nih.gov/19620931/'],
['Zhu et al., 2025','Effects of plyometric and strength training on the physical fitness attributes of male adolescent team sports athletes: a systematic review and meta-analysis','69 studies / 2,051 male adolescent team-sport athletes; both strength and plyometric training improved acceleration, sprint, COD and jump outcomes.','https://pubmed.ncbi.nlm.nih.gov/41361490/'],
['Zhang et al., 2026','The effects of plyometric training on physical fitness in adolescent team sports: a systematic review and meta-analysis','31 studies / 1,033 adolescents; plyometrics improved jump, sprint and COD performance; higher jump volume was not consistently associated with larger effects.','https://pubmed.ncbi.nlm.nih.gov/41647156/'],
['Yuan et al., 2026','The effects of plyometric training on adolescent sports performance: a systematic review and meta-analysis','63 studies; significant improvements in jumping, sprinting and agility.','https://pubmed.ncbi.nlm.nih.gov/42504251/'],
['Li & Zhu, 2025','The preventive effects of neuromuscular training on lower extremity sports injuries in adolescent and young athletes: a systematic review and meta-analysis','24 studies; NMT reduced lower-extremity injury risk, including knee and ankle injury risk.','https://pubmed.ncbi.nlm.nih.gov/40618548/'],
['Zhang et al., 2026','Comparative effects of unilateral and bilateral plyometric training on physical fitness in adolescent team-sport athletes','11 studies / 388 adolescents; no clear overall unilateral-vs-bilateral advantage for bilateral jump/sprint/COD, with task-specific single-leg effects.','https://pubmed.ncbi.nlm.nih.gov/42125197/']
];v.innerHTML=`<div class="kicker">Evidence library</div><h2 style="margin:3px 0">Research used by the system</h2><p class="muted">The app distinguishes youth-specific evidence from adult extrapolation. Exact exercise choices are implementation decisions within supported movement categories, not claims that one exercise is universally optimal.</p><div class="research">${sources.map(s=>`<div class="card"><div class="row spaced"><div><div class="kicker">${esc(s[0])}</div><h3 style="margin:3px 0">${esc(s[1])}</h3></div><a class="btn" href="${s[3]}" target="_blank" rel="noopener">PubMed</a></div><p class="source-meta">${esc(s[2])}</p></div>`).join('')}</div>`}
function renderSettings(){const v=document.getElementById('view-settings');v.innerHTML=`<div class="kicker">Personalization</div><h2 style="margin:3px 0 14px">Athlete Profile & Data</h2><div class="grid grid-2"><div class="card"><h3>Profile</h3><div class="formgrid-2 formgrid"><div class="field"><label>Name</label><input id="p-name" value="${esc(state.profile.name)}"></div><div class="field"><label>Age</label><input id="p-age" type="number" value="${esc(state.profile.age)}"></div><div class="field"><label>Sex</label><input id="p-sex" value="${esc(state.profile.sex)}"></div><div class="field"><label>Height cm</label><input id="p-heightCm" type="number" value="${esc(state.profile.heightCm)}"></div><div class="field"><label>Weight kg</label><input id="p-weightKg" type="number" step="0.1" value="${esc(state.profile.weightKg)}"></div><div class="field"><label>Positions</label><input id="p-positions" value="${esc(state.profile.positions)}"></div></div><div class="field" style="margin-top:10px"><label>Weight/physique goal</label><input id="p-goalWeight" value="${esc(state.profile.goalWeight)}"></div><div class="field" style="margin-top:10px"><label>Clinical/safety note</label><textarea id="p-note">${esc(state.health.clinicalNote)}</textarea></div><div class="row" style="margin-top:12px"><button class="btn primary" onclick="updateProfile()">Save profile</button></div></div><div class="card"><h3>System preferences</h3><div class="field"><label>Default compound RIR</label><input value="${esc(state.settings.defaultRir)}" disabled></div><div class="field" style="margin-top:10px"><label>Next anchor</label><select onchange="state.settings.nextAnchor=this.value;save();toast('Next anchor updated')"><option ${state.settings.nextAnchor==='A'?'selected':''}>A</option><option ${state.settings.nextAnchor==='B'?'selected':''}>B</option></select></div><p class="muted small" style="margin-top:10px">The system is intentionally low-burden. Edit settings only when something genuinely changes.</p></div></div><div class="section-title"><div class="kicker">Backups</div><h2 style="margin:4px 0">Your data stays local</h2></div><div class="card"><div class="row"><button class="btn" onclick="exportJSON()">Export full JSON backup</button><button class="btn" onclick="exportCSV()">Export workout CSV</button><label class="btn">Import JSON<input type="file" accept="application/json" style="display:none" onchange="importJSON(this.files[0])"></label><button class="btn danger" onclick="resetData()">Reset app data</button></div><p class="muted small" style="margin-top:12px">The app uses browser localStorage. Keep a JSON backup periodically, especially before switching phones or browsers.</p></div><div class="section-title"><div class="kicker">Current health flags</div><h2 style="margin:4px 0">Baseline pain (self-reported)</h2></div><div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Area</th><th>Daily baseline</th><th>Training symptom rating</th></tr></thead><tbody>${Object.keys(state.health.trainingPain).map(k=>`<tr><td>${esc(k)}</td><td>${state.health.painBaseline[k]??'—'}</td><td>${state.health.trainingPain[k]??'—'}</td></tr>`).join('')}</tbody></table></div></div>`}
function render(){renderToday();renderLog();renderPlan();renderExercises();renderProgress();renderRules();renderResearch();renderSettings();document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id==='view-'+currentView));document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===currentView));document.getElementById('pageTitle').textContent=navItems.find(x=>x[0]===currentView)?.[1]||currentView}
initNav();render();

let deferredInstallPrompt = null;
window.addEventListener("beforeinstallprompt", (event) => {
  event.preventDefault();
  deferredInstallPrompt = event;
  const btn = document.getElementById("installBtn");
  if (btn) btn.style.display = "inline-flex";
});
window.addEventListener("appinstalled", () => {
  deferredInstallPrompt = null;
  const btn = document.getElementById("installBtn");
  if (btn) btn.style.display = "none";
  toast("Athlete OS installed on this device");
});
async function installApp(){
  if (!deferredInstallPrompt) {
    toast("Use your browser's Add to Home Screen / Install App option");
    return;
  }
  deferredInstallPrompt.prompt();
  try { await deferredInstallPrompt.userChoice; } catch(e) {}
  deferredInstallPrompt = null;
  const btn = document.getElementById("installBtn");
  if (btn) btn.style.display = "none";
}
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}
</script>
